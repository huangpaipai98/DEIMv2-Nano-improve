__include__: [
  '../deimv2/deimv2_hgnetv2_n_coco.yml',
]

find_unused_parameters: False

print_freq: 500
checkpoint_freq: 10

output_dir: ./outputs/deimv2_hgnetv2_n_improve_visdrone


HGNetv2:
  name: 'Pico'
  return_idx: [0, 1, 2]


HybridEncoder:
  in_channels: [64, 256, 512]
  feat_strides: [8, 16, 32]

  # intra
  use_encoder_idx: [2]

  version: 'dfine'

  use_downsample: True
  downsample_pretrained: True # Only support HGNetv2: name='Pico'、return_idx=[0, 1, 2]

  loops: [[2]]

  # hyper ace
  hyperace:
    c1: [128, 128, 128]
    c2: 128
    num_hyperedges: 4


DEIMTransformer:
  feat_channels: [128, 128, 128]
  feat_strides: [8, 16, 32]
  num_levels: 3
  num_points: [6, 6, 6]

  loops: [2, 2, 1]


optimizer:
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00015
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00015
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0003


# Increase to search for the optimal ema
epoches: 232 # 160 + 12 + 60

warmup_iter: 2000

num_classes: 11


train_dataloader: 
  dataset:
    img_folder: ../data/VisDrone2019-DET/train/
    ann_file: ../data/VisDrone2019-DET/annotations/instances_train.json
    transforms:
      policy:
        epoch: [4, 90, 172]   # list
      mosaic_prob: 0.5

  collate_fn:
    mixup_prob: 0.5
    mixup_epochs: [4, 90]
    copyblend_prob: 0.4
    copyblend_epochs: [4, 90]   # CP half
    area_threshold: 100
    stop_epoch: 172

  total_batch_size: 8


val_dataloader:
  dataset: 
    img_folder: ../data/VisDrone2019-DET/test-dev/
    ann_file: ../data/VisDrone2019-DET/annotations/instances_test-dev.json

  total_batch_size: 16


DEIMCriterion:
  matcher:
    change_matcher: True
    matcher_change_epoch: 160
